# Checks on every pull request and on main, on the supported Ubuntu 26.04: the
# glass alpha keeps primary text above WCAG AA, both stylesheets parse with the
# real GTK 3 and GTK 4 parsers, the desktop installer's dconf-list surgery and
# its uninstall rules hold, the shell scripts are clean, and the norvi-os
# metapackage builds twice byte for byte. A clean VM then installs that exact
# package, loads the packaged desktop and exercises both installers and rollback.
# No secrets, read-only token, GitHub-owned actions
# pinned by commit.
name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 \
            python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 shellcheck build-essential debhelper dpkg-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contrast
        run: |
          python3 desktop/check_contrast.py
          python3 desktop/check_glass_tokens.py
      - name: VM harness regression checks
        run: python3 -m unittest discover -s tests/vm -p 'test_*.py'
      - name: GTK stylesheets parse
        run: |
          python3 desktop/check_gtk_css.py
          bash desktop/test-gtk-css-check.sh
      - name: Desktop installer rules
        run: |
          bash desktop/test-blacklist-merge.sh
          bash desktop/test-uninstall-restore.sh
          # The installer refuses root, so a root container runs it as nobody.
          if [ "$(id -u)" = 0 ]; then
            setpriv --reuid=65534 --regid=65534 --clear-groups bash desktop/test-install-desktop.sh
          else
            bash desktop/test-install-desktop.sh
          fi
      - name: Shell scripts
        run: shellcheck -S warning install.sh uninstall.sh desktop/*.sh scripts/build.sh tests/vm/*.sh
      - name: Build the package twice and compare
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/build.sh /tmp/one
          scripts/build.sh /tmp/two
          for f in /tmp/one/*; do cmp "$f" "/tmp/two/$(basename "$f")"; done
          mkdir -p dist/deb
          cp /tmp/one/*.deb dist/deb/
          (cd dist/deb && sha256sum -- *.deb > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: norvi-os-debian-candidate
          path: dist/deb/
          if-no-files-found: error
          retention-days: 14
  runtime:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: VM prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/norvi-vm
          key: ubuntu-resolute-cloud-release-20261016-v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: norvi-os-debian-candidate
          path: candidate
      - name: Install, load, operate and roll back the candidate
        run: |
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          python3 tests/vm/run.py --candidate "$(find candidate -name 'norvi-os_*_all.deb' -print -quit)" --out vm-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clean-vm-evidence
          path: vm-evidence/
          if-no-files-found: error
          retention-days: 14
  checks:
    if: always()
    needs: [package, runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require package and VM acceptance
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: test "$PACKAGE_RESULT" = success && test "$RUNTIME_RESULT" = success
